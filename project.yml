name: FinanceMobileIOS
options:
  bundleIdPrefix: fr.hedwin
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  FinanceMobileIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FinanceMobileIOS
    resources:
      - path: FinanceMobileIOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.hedwin.financemobileios
        INFOPLIST_FILE: FinanceMobileIOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  FinanceMobileIOS:
    build:
      targets:
        FinanceMobileIOS: all
    run:
      config: Debug
    archive:
      config: Release
