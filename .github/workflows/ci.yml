name: CI

# Vérification uniquement — aucune publication.
#
# Ce dépôt est public : y placer les secrets d'une chaîne de release (clé App
# Store Connect, certificat de signature) élargirait la surface d'attaque sans
# contrepartie, les workflows déclenchés depuis un fork étant un vecteur connu.
# Publier depuis Xcode reste plus simple et moins fragile. Si l'automatisation
# devient nécessaire, sa place est un workflow manuel sous environnement
# protégé, pas ici.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deux secondes, aucune dépendance : ce travail échoue vite et dit pourquoi.
  garde-fous:
    name: Garde-fous
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pureté des moteurs
        run: ./Tests/check_purity.sh

      - name: Absence de données bancaires réelles
        run: python3 Tests/check_no_personal_data.py

      - name: SwiftUI cantonné aux vues
        run: |
          # La frontière entre logique et présentation n'est utile que si elle
          # est vérifiée : sans ça elle fuit un fichier à la fois.
          fuites=$(git ls-files 'Nemoris/**/*.swift' \
            | grep -v '/Views/' \
            | grep -v '^Nemoris/DesignSystem/' \
            | grep -v '^Nemoris/App/' \
            | xargs grep -l '^import SwiftUI' 2>/dev/null || true)
          if [ -n "$fuites" ]; then
            echo "❌ SwiftUI importé hors des vues :"
            echo "$fuites" | sed 's/^/      /'
            exit 1
          fi
          echo "✅ SwiftUI reste dans Views/, DesignSystem/ et App/"

  moteurs:
    name: Moteurs purs
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Harnais swiftc
        run: |
          cd Tests
          echec=0
          for s in run_*.sh; do
            # Le corpus mesure un SPECTRE, pas une non-régression : son score
            # bouge légitimement quand l'extraction s'améliore. Il tourne, mais
            # ne fait pas échouer la CI.
            if [ "$s" = "run_merchant_corpus_tests.sh" ]; then
              ./"$s" || echo "⚠️  spectre sous le plancher — à regarder, non bloquant"
              continue
            fi
            ./"$s" || { echo "❌ $s"; echec=1; }
          done
          exit $echec

  build:
    name: Compilation ${{ matrix.plateforme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - plateforme: iOS
            destination: 'generic/platform=iOS Simulator'
            sdk: '-sdk iphonesimulator'
          - plateforme: macOS
            destination: 'platform=macOS,arch=arm64'
            sdk: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: |
          xcodebuild -project Nemoris.xcodeproj -scheme Nemoris \
            ${{ matrix.sdk }} -destination '${{ matrix.destination }}' \
            -derivedDataPath build/ci build | xcpretty || exit ${PIPESTATUS[0]}

  tests:
    name: Suite XCTest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Simulateur
        run: xcrun simctl list devices available | head -20
      - name: Tests et couverture
        run: |
          xcodebuild test -project Nemoris.xcodeproj -scheme Nemoris \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/ci -enableCodeCoverage YES \
            | xcpretty || exit ${PIPESTATUS[0]}
      - name: Couverture par couche
        run: ./Tests/coverage.sh || true
